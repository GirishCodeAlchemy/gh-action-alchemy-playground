apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample-chart.fullname" . }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "sample-chart.name" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-chart.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "sample-chart.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "sample-chart.name" . }}
    spec:
      containers:
        - name: {{ include "sample-chart.name" . }}
          image: "nginx:latest"
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
