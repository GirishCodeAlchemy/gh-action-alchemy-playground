# Sample Kaniko workflow for building and pushing the sample Node.js app
name: Kaniko Node.js Sample

on:
  workflow_dispatch:

jobs:
  kaniko-build-push:
    uses: girishcodealchemy/gh-actions-alchemy/.github/workflows/kaniko-gcp-nonprod.yml@main
    with:
      runner: nonprod-linux-x64-medium
      workingDirectory: sample-nodejs-app
      environment: nonprod
      dockerfile: sample-nodejs-app/Dockerfile
      context: sample-nodejs-app
      registry: gcr.io/YOUR_PROJECT_ID
      image: sample-nodejs-app
      tag: latest
      push: 'true'
