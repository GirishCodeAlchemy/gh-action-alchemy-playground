name: Dynamic Dockerfile Build

on:
  push:
    paths:
      - '**/Dockerfile'
  pull_request:
    paths:
      - '**/Dockerfile'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch: scanning all Dockerfile directories."
            files=$(find . -name 'Dockerfile')
          else
            echo "Push/PR: scanning directories with changed files."
            # Get all changed files in the commit range
            changed_files=$(git diff --name-only ${{ github.event.before || 'HEAD^' }} ${{ github.sha }})
            # Get unique directories containing changed files or Dockerfile
            dirs=$(echo "$changed_files" | awk -F/ '{OFS="/"; if (NF>1) print $1; else print "."}' | sort -u)
            files=""
            for dir in $dirs; do
              if [[ -f "$dir/Dockerfile" ]]; then
                files="$files $dir/Dockerfile"
              fi
            done
          fi

          matrix='[]'
          for file in $files; do
            dir=$(dirname "$file")
            parent_name=$(basename "$dir")
            tag="${parent_name}-${{ github.run_number }}"
            # Remove leading ./ and the last directory from the path for image name
            name=$(dirname "${dir#./}")
            name="${name#/}" # Remove leading slash if present
            # tag="${name//\//-}-${{ github.run_number }}" # Replace / with - for tag
            matrix=$(jq -c --arg dir "$dir" --arg image "$name" --arg tag "$tag" '. += [{"directory": $dir, "image": $image, "tag": $tag}]' <<< "$matrix")
          done

          echo "matrix=$matrix" >> $GITHUB_OUTPUT

      - name: Output Matrix
        run: |
          echo "Matrix: ${{ steps.set-matrix.outputs.matrix }}"

  build-images:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    name: Build Docker image for ${{ matrix.image }}
    uses: girishcodealchemy/gh-action-alchemy/.github/workflows/kaniko-gcp-nonprod.yml@main
    with:
      runner: nonprod-linux-x64-medium
      workingDirectory: ${{ matrix.directory }}
      environment: nonprod
      dockerfile: ${{ matrix.directory }}/Dockerfile
      context: ${{ matrix.directory }}
      registry: gcr.io/YOUR_PROJECT_ID
      image: ${{ matrix.image }}
      imageName: ${{ matrix.image }}
      tag: ${{ matrix.tag }}
      push: 'true'
    permissions:
      contents: 'read'
      id-token: 'write'
