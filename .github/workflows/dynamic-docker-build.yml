name: Dynamic Dockerfile Build

on:
  push:
    paths:
      - '**/Dockerfile'
  pull_request:
    paths:
      - '**/Dockerfile'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Triggered by manual dispatch — scanning all Dockerfiles."
            files=$(find . -name 'Dockerfile')
          else
            echo "Triggered by push/PR — scanning changed Dockerfiles."
            files=$(git diff --name-only ${{ github.event.before || 'HEAD^' }} ${{ github.sha }} | grep 'Dockerfile' || true)
          fi

          matrix='[]'
          for file in $files; do
            dir=$(dirname "$file")
            name=$(basename "$dir")
            tag="${name}-${{ github.run_number }}"
            matrix=$(jq -c --arg dir "$dir" --arg image "$name" --arg tag "$tag" '. += [{"directory": $dir, "image": $image, "tag": $tag}]' <<< "$matrix")
          done

          echo "matrix=$matrix" >> $GITHUB_OUTPUT

      - name: Output Matrix
        run: |
          echo "Matrix: ${{ steps.set-matrix.outputs.matrix }}"

  build-images:
    needs: detect-changes
    if: ${{ fromJson(needs.detect-changes.outputs.matrix).length() > 0 }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: girishcodealchemy/gh-actions-alchemy/.github/workflows/kaniko-gcp-nonprod.yml@main
    with:
      runner: nonprod-linux-x64-medium
      workingDirectory: ${{ matrix.directory }}
      environment: nonprod
      dockerfile: ${{ matrix.directory }}/Dockerfile
      context: ${{ matrix.directory }}
      registry: gcr.io/YOUR_PROJECT_ID
      image: ${{ matrix.image }}
      tag: ${{ matrix.tag }}
      push: 'true'
